<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQUA-VOLT System Monitor</title>
  
  <!-- p5.js Core Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <!-- p5.ble.js Library -->
  <script src="https://unpkg.com/p5ble@0.0.7/dist/p5.ble.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #121212; 
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    canvas {
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      border: 2px solid #333;
    }
  </style>
</head>
<body>

  <script>
    /************************************************************
     AQUA-VOLT DRAIN CLEANER - WEB DASHBOARD
     p5.js Mode (Single-File Web Bluetooth Version)
    ************************************************************/

    // --- BLE UUID CONFIGURATION ---
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

    // --- SYSTEM SETTINGS ---
    const WATER_LIMIT = 25; // Flood triggers when water is >= 25cm
    const TANK_DEPTH = 30;  // Max water level capacity

    // --- BLE STATE VARIABLES ---
    let myBLE;
    let isConnected = false;

    // --- VARIABLES ---
    let currentDistance = 0; 
    let waveTime = 0;
    let floodAlertTriggered = false;

    // Buttons Coordinates
    let testBtnX, testBtnY, testBtnW, testBtnH;
    let btBtnX, btBtnY, btBtnW, btBtnH;

    // Test Mode Variable
    let testMode = false;

    // Tank graphical coordinates
    let tankX, tankY, tankW, tankH;

    function setup() {
      createCanvas(800, 500);
      
      // Initialize p5.ble.js
      myBLE = new p5ble();

      // Define tank dimensions and placement 
      tankW = 200;
      tankH = 300;
      tankX = width - tankW - 100;
      tankY = height / 2 - tankH / 2 + 40;

      // Define Top Control Buttons
      btBtnW = 180;
      btBtnH = 35;
      btBtnX = width / 2 - btBtnW - 10;
      btBtnY = 60;

      testBtnW = 160;
      testBtnH = 35;
      testBtnX = width / 2 + 10;
      testBtnY = 60;
    }

    function draw() {
      background(30);

      // 1. HEADER
      fill(255);
      textAlign(CENTER, TOP);
      textSize(28);
      text("AQUA-VOLT SYSTEM MONITOR", width / 2, 20);

      // 2. DRAW CONNECT BLUETOOTH BUTTON
      if (isConnected) {
        fill(40, 167, 69); // Green when connected
      } else {
        fill(0, 123, 255); // Blue when disconnected
      }
      stroke(200);
      strokeWeight(2);
      rect(btBtnX, btBtnY, btBtnW, btBtnH, 8);
      
      fill(255);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      text(isConnected ? "BT: CONNECTED" : "CONNECT BLUETOOTH", btBtnX + btBtnW / 2, btBtnY + btBtnH / 2);

      // 3. DRAW TEST MODE BUTTON
      if (testMode) {
        fill(200, 50, 50); // Red when ON
      } else {
        fill(70); // Gray when OFF
      }
      stroke(200);
      strokeWeight(2);
      rect(testBtnX, testBtnY, testBtnW, testBtnH, 8);
      
      fill(255);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(14);
      text(testMode ? "TEST MODE: ON" : "TEST MODE: OFF", testBtnX + testBtnW / 2, testBtnY + testBtnH / 2);
      
      // 4. TEST MODE SIMULATION OVERRIDE
      if (testMode) {
        if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
          currentDistance = map(mouseY, height, 0, 0, TANK_DEPTH);
          currentDistance = constrain(currentDistance, 0, TANK_DEPTH);
        }
      }

      // 5. UI: LEFT SIDE DATA DISPLAY
      textAlign(LEFT, CENTER);
      
      fill(45);
      stroke(100);
      strokeWeight(2);
      rect(50, tankY, 300, tankH, 10);
      
      noStroke();
      fill(200);
      textSize(18);
      text("CURRENT SENSOR DATA", 70, tankY + 30);
      
      stroke(100);
      line(70, tankY + 50, 330, tankY + 50);
      
      noStroke();
      textSize(24);
      text("Water Level:", 70, tankY + 100);
      
      if (currentDistance >= WATER_LIMIT) {
        fill(255, 50, 50); // Red
      } else if (currentDistance >= WATER_LIMIT - 5) {
        fill(255, 200, 50); // Yellow
      } else {
        fill(50, 255, 100); // Green
      }
      textSize(36);
      text(currentDistance.toFixed(1) + " cm", 70, tankY + 140);
      
      fill(200);
      textSize(16);
      text("Safety Limit: " + WATER_LIMIT + " cm", 70, tankY + 200);
      text("Status: " + (currentDistance >= WATER_LIMIT ? "FLOODING / MOTOR STOP" : "NORMAL"), 70, tankY + 230);

      // 6. UI: RIGHT SIDE TANK & WAVE ANIMATION
      fill(20);
      stroke(150);
      strokeWeight(4);
      rect(tankX, tankY, tankW, tankH);

      let waterY = map(currentDistance, 0, TANK_DEPTH, tankY + tankH, tankY);
      waterY = constrain(waterY, tankY, tankY + tankH);

      noStroke();
      fill(0, 150, 255, 200); 
      
      beginShape();
      for (let x = tankX; x <= tankX + tankW; x += 5) {
        let waveAmplitude = (waterY >= tankY + tankH) ? 0 : 8; 
        let y = waterY + sin(waveTime + x * 0.05) * waveAmplitude;
        y = constrain(y, tankY, tankY + tankH); 
        vertex(x, y);
      }
      
      vertex(tankX + tankW, tankY + tankH);
      vertex(tankX, tankY + tankH);
      endShape(CLOSE);

      noFill();
      stroke(200);
      strokeWeight(4);
      rect(tankX, tankY, tankW, tankH);

      waveTime += 0.08;

      // 7. FLOOD NOTIFICATION SYSTEM
      if (currentDistance >= WATER_LIMIT) {
        if (frameCount % 60 < 30) {
          fill(255, 0, 0);
          noStroke();
          textAlign(CENTER, CENTER);
          textSize(22);
          text("⚠️ WARNING: MAXIMUM WATER LEVEL EXCEEDED ⚠️", width / 2, 115);
        }
        
        if (!floodAlertTriggered) {
          setTimeout(() => {
            alert("AQUA-VOLT NOTIFICATION:\n\nMaximum water limit exceeded! Emergency motor shutdown active.");
          }, 50); 
          floodAlertTriggered = true;
        }
      } else {
        floodAlertTriggered = false;
      }
    }

    // --- BUTTON CLICK EVENTS ---
    function mousePressed() {
      // Bluetooth Connect Click Handler
      if (mouseX > btBtnX && mouseX < btBtnX + btBtnW && mouseY > btBtnY && mouseY < btBtnY + btBtnH) {
        if (!isConnected) {
          myBLE.connect(SERVICE_UUID, gotCharacteristics);
        }
      }

      // Test Mode Toggle Click Handler
      if (mouseX > testBtnX && mouseX < testBtnX + testBtnW && mouseY > testBtnY && mouseY < testBtnY + testBtnH) {
        testMode = !testMode;
      }
    }

    // --- p5.ble.js CALLBACKS ---
    function gotCharacteristics(error, characteristics) {
      if (error) {
        console.error('Connection error: ', error);
        alert("Bluetooth pairing failed or was canceled.");
        return;
      }
      
      isConnected = true;
      console.log("Bluetooth Connected!");
      
      // Set p5.ble to listen for changes and parse the payload as a string
      myBLE.startNotifications(characteristics[0], handleBleData, 'string');
    }

    function handleBleData(value) {
      if (testMode) return; // Skip updating from sensor if user is actively testing

      try {
        let data = JSON.parse(value);
        if (data.waterLevel !== undefined) {
          currentDistance = data.waterLevel;
        }
      } catch (err) {
        console.error("Failed to parse BLE packet:", value);
      }
    }
  </script>
</body>
</html>
